# UCACUE Bar - Docker Compose
# Configuracion simplificada para inicio rapido
# Para configuracion completa con nginx y mediamtx, usar ops/docker-compose.yml

name: ucacue-bar

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: ucacue_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ucacue_erp}
      MYSQL_USER: ${DB_USER:-ucacue_user}
      MYSQL_PASSWORD: ${DB_PASS:-ucacue_pass}
      TZ: America/Guayaquil
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ucacue_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: ucacue_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ucacue_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ucacue_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ucacue_erp}
      DB_USER: ${DB_USER:-ucacue_user}
      DB_PASS: ${DB_PASS:-ucacue_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - ucacue_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend Vite/React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090/api}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8090/api/ws}
    container_name: ucacue_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ucacue_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  ucacue_network:
    driver: bridge

volumes:
  mysql_data:
    name: ucacue_mysql_data
  redis_data:
    name: ucacue_redis_data
  backend_logs:
    name: ucacue_backend_logs
  backend_uploads:
    name: ucacue_backend_uploads
