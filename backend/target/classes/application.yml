spring:
  application:
    name: ucacue-bar
  mvc:
    servlet:
      path: ${CONTEXT_PATH:/api}

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:ucacue_erp}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Guayaquil&createDatabaseIfNotExist=true
    username: ${DB_USER:ucacue_user}
    password: ${DB_PASS:ucacue_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${SHOW_SQL:false}
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      repositories:
        enabled: false
  cache:
    type: caffeine
    cache-names: firebase-tokens, products-public
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s

  # mail deshabilitado

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}
  enabled: ${FIREBASE_ENABLED:true}

payment:
  payphone:
    key: ${PAYPHONE_KEY}
    endpoint: ${PAYPHONE_ENDPOINT:https://pay.payphonetodoesposible.com/api}
  datafast:
    key: ${DATAFAST_KEY}
    endpoint: ${DATAFAST_ENDPOINT:https://sandbox.datafast.com.ec/api}

webrtc:
  gateway:
    base-url: ${WEBRTC_GATEWAY_BASE:http://localhost:8889}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ucacue.bar: ${LOG_LEVEL:DEBUG}
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8090,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8080,http://127.0.0.1:8090}
  loyalty:
    points-per-dollar: ${LOYALTY_POINTS_PER_DOLLAR:1}

