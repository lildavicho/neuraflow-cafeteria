spring:
  application:
    name: ucacue-bar

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:ucacue_erp}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Guayaquil&createDatabaseIfNotExist=true
    username: ${DB_USER:ucacue_user}
    password: ${DB_PASS:ucacue_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect # ← actualizado, el anterior está deprecado
        format_sql: true
    show-sql: ${SHOW_SQL:true}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/api}
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-your-256-bit-secret-key}
    expiration: ${JWT_EXPIRATION:86400}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:ucacuebar}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase/ucacuebar-firebase-adminsdk.json}

algolia:
  application-id: ${ALGOLIA_APP_ID:ZC1H8MVX05}
  api-key: ${ALGOLIA_API_KEY:9c0c8a0e2f8f9d8b7c6a5e4d3c2b1a0f}
  search-api-key: ${ALGOLIA_SEARCH_API_KEY:4dea24d6f6c0f12ac5e8d9b4e2f890c0}
  index-name: ${ALGOLIA_INDEX_NAME:productos_venta}

payment:
  payphone:
    key: ${PAYPHONE_KEY:}
    endpoint: ${PAYPHONE_ENDPOINT:https://pay.payphonetodoesposible.com/api}
  datafast:
    key: ${DATAFAST_KEY:}
    endpoint: ${DATAFAST_ENDPOINT:https://sandbox.datafast.com.ec/api}

webrtc:
  gateway:
    base-url: ${WEBRTC_GATEWAY_BASE:http://localhost:8889}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ucacue.bar: ${LOG_LEVEL:DEBUG}
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

