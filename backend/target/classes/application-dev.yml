spring:
  datasource:
    url: jdbc:h2:mem:ucacue;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true

server:
  port: 8081
  servlet:
    context-path: /api

firebase:
  service-account-path: classpath:firebase_credentials.json
  project-id: baru-fe8a3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: false
    mail:
      enabled: false
