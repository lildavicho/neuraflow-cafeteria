# MediaMTX configuration tuned for UCACUE Bar deployment

# --- General ---
logLevel: info
logDestinations: [stdout]
logFile: mediamtx.log

# --- API & Metrics ---
api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998

# --- RTSP ---
rtsp: yes
rtspTransports: [tcp, udp]
rtspAddress: :8554
rtspsAddress: :8555
rtpAddress: :8000
rtcpAddress: :8001

# --- RTMP ---
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# --- HLS (HTTP/HTTPS delivery) ---
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
hlsSegmentCount: 7
hlsSegmentDuration: 1s

# --- WebRTC ---
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: "*"
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcAdditionalHosts: []
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# --- Default path behavior ---
pathDefaults:
  record: no
  recordFormat: fmp4

# --- Paths configuration ---
paths:
  cam1:
    source: rtsp://admin:Adm1n99.@172.16.41.178:554/Streaming/Channels/101
    rtspTransport: tcp
    sourceOnDemand: no
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
    maxReaders: 10
    record: no

  all:
    source: publisher
    maxReaders: 10
