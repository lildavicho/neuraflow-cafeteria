name: ucacue-bar

services:
  mysql:
    image: mysql:8.0
    container_name: ucacue_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ucacue_erp
      MYSQL_USER: ucacue_user
      MYSQL_PASSWORD: ucacue_pass
      TZ: America/Guayaquil
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ucacue_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ucacue_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ucacue_network

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ucacue_app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ucacue_erp
      DB_USER: ucacue_user
      DB_PASS: ucacue_pass
      REDIS_HOST: redis
    env_file:
      - ../backend/.env
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
      - ./migrate/sql/serviceAccount.json:/app/serviceAccount.json:ro
    networks:
      - ucacue_network

  frontend:
    image: node:20-alpine
    container_name: ucacue_frontend
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install -g vite && npm install && npm run build && vite preview --host 0.0.0.0 --port 5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - ucacue_network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ucacue_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    networks:
      - ucacue_network

  nginx:
    image: nginx:stable
    container_name: ucacue_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      app:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - ucacue_network

networks:
  ucacue_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_logs:
  app_uploads:
  nginx_logs:
  frontend_node_modules:
