version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ucacue_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ucacue_erp
      TZ: America/Guayaquil
      # --- Sugerencia aplicada: Acelera el inicio ---
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # --- Sugerencia aplicada: :rw para evitar problemas de permisos ---
      - ./migrate/sql:/docker-entrypoint-initdb.d:rw
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - ucacue_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ucacue_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ucacue_network
    command: redis-server --appendonly yes

  app:
    build:
      context: ../backend # Ruta correcta: Sube un nivel desde 'ops' y entra a 'backend'
      dockerfile: Dockerfile
    container_name: ucacue_app
    restart: unless-stopped
    env_file:
      - ../.env # Ruta correcta: Sube un nivel desde 'ops' al .env raíz
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ucacue_network
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ucacue_mediamtx
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: "tcp,udp,http,https,webrtc"
      MTX_WEBRTCADDITIONALHOSTS: "localhost,192.168.1.100"
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml # Ruta correcta: 'mediamtx.yml' está en 'ops'
    networks:
      - ucacue_network

  nginx:
    image: nginx:stable
    container_name: ucacue_nginx
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Ruta correcta: 'nginx.conf' está en 'ops'
    - ../frontend/dist:/usr/share/nginx/html:ro # Ruta correcta: Sube un nivel, entra a 'frontend/dist'
    - ./nginx_logs:/var/log/nginx
    # --- Sugerencia aplicada: Se quita :ro por si hay problemas de permisos en Windows ---
    - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - ucacue_network

# --- BLOQUES DE NIVEL SUPERIOR ---
# (Indentación corregida)

networks:
  ucacue_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_logs:
  app_uploads:
  nginx_logs:




