<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#a30606" opacity="0.1"/>
  
  <!-- Coffee cup -->
  <g transform="translate(100, 100)">
    <!-- Cup body -->
    <path d="M -35 -20 L -30 30 C -30 35 -20 40 0 40 C 20 40 30 35 30 30 L 35 -20 Z" 
          fill="#a30606" stroke="#7d0505" stroke-width="2"/>
    
    <!-- Cup handle -->
    <path d="M 35 -10 Q 50 -10 50 5 Q 50 20 35 20" 
          fill="none" stroke="#7d0505" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Coffee surface -->
    <ellipse cx="0" cy="-20" rx="35" ry="8" fill="#5c0404"/>
    
    <!-- Steam -->
    <path d="M -15 -35 Q -20 -45 -15 -55" 
          fill="none" stroke="#a30606" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 0 -40 Q -5 -50 0 -60" 
          fill="none" stroke="#a30606" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 15 -35 Q 20 -45 15 -55" 
          fill="none" stroke="#a30606" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Text UCACUE -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="#a30606">UCACUE</text>
  <text x="100" y="192" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#666">BAR</text>
</svg>
