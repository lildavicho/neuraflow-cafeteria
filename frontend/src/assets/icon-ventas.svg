<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ventasGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Billete/ticket -->
  <rect x="10" y="16" width="28" height="16" rx="2" fill="url(#ventasGradient)" opacity="0.9"/>
  <rect x="12" y="18" width="24" height="12" rx="1" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.4"/>
  
  <!-- Símbolo de dólar -->
  <text x="24" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="Inter, sans-serif">$</text>
  
  <!-- Líneas decorativas -->
  <line x1="14" y1="22" x2="20" y2="22" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="28" y1="22" x2="34" y2="22" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="26" x2="18" y2="26" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="26" x2="34" y2="26" stroke="white" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Animación de "count-up" -->
  <circle cx="36" cy="12" r="6" fill="#ef4444" opacity="0.9">
    <animate attributeName="r" values="0;6" dur="0.5s" fill="freeze"/>
  </circle>
  <text x="36" y="14" text-anchor="middle" font-size="7" font-weight="bold" fill="white" font-family="Inter, sans-serif">+</text>
</svg>
