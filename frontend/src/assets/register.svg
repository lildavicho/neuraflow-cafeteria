<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="registerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5161D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B1114;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Usuario -->
  <circle cx="28" cy="24" r="8" fill="url(#registerGradient)" opacity="0.9"/>
  <path d="M 16 48 Q 16 38 28 38 Q 40 38 40 48 L 40 52 L 16 52 Z" fill="url(#registerGradient)" opacity="0.9"/>
  
  <!-- Signo + (agregar usuario) -->
  <circle cx="48" cy="20" r="12" fill="#10b981" opacity="0.95">
    <animate attributeName="r" values="12;13;12" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M 48 14 L 48 26 M 42 20 L 54 20" 
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Formulario decorativo -->
  <rect x="12" y="28" width="24" height="2" rx="1" fill="#D1D5DB" opacity="0.4"/>
  <rect x="12" y="34" width="20" height="2" rx="1" fill="#D1D5DB" opacity="0.4"/>
  <rect x="12" y="40" width="22" height="2" rx="1" fill="#D1D5DB" opacity="0.4"/>
</svg>
