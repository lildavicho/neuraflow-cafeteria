<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loginGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5161D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B1114;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Puerta -->
  <rect x="18" y="12" width="28" height="40" rx="2" fill="url(#loginGradient)" opacity="0.9"/>
  <rect x="20" y="14" width="24" height="36" rx="1" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Manija -->
  <circle cx="38" cy="32" r="2.5" fill="white" opacity="0.9"/>
  
  <!-- Usuario entrando -->
  <circle cx="32" cy="26" r="5" fill="white" opacity="0.85"/>
  <path d="M 24 40 Q 24 34 32 34 Q 40 34 40 40 L 40 44 L 24 44 Z" fill="white" opacity="0.85"/>
  
  <!-- Flecha de acceso -->
  <path d="M 48 32 L 56 32 M 52 28 L 56 32 L 52 36" 
        fill="none" stroke="#C5161D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 2,0; 0,0" dur="1.5s" repeatCount="indefinite"/>
  </path>
</svg>
