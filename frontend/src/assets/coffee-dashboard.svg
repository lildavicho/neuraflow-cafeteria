<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coffeeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4423;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="foamGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Vista superior de taza -->
  <ellipse cx="40" cy="40" rx="32" ry="30" fill="url(#coffeeGradient)" opacity="0.95"/>
  
  <!-- Espuma/crema -->
  <ellipse cx="40" cy="40" rx="28" ry="26" fill="url(#foamGradient)" opacity="0.9"/>
  
  <!-- Gráfico circular de estadísticas (simulando latte art) -->
  <circle cx="40" cy="40" r="18" fill="none" stroke="#6B4423" stroke-width="3" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0 113; 113 0" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Burbujas animadas -->
  <circle cx="30" cy="35" r="2" fill="white" opacity="0.7">
    <animate attributeName="cy" values="35;32;35" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="38" r="1.5" fill="white" opacity="0.6">
    <animate attributeName="cy" values="38;36;38" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="32" r="1.8" fill="white" opacity="0.65">
    <animate attributeName="cy" values="32;29;32" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.25;0.65" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Líneas de estadísticas (latte art) -->
  <path d="M 35 40 Q 40 35 45 40" fill="none" stroke="#C5161D" stroke-width="2" opacity="0.7"/>
  <path d="M 32 45 Q 40 42 48 45" fill="none" stroke="#C5161D" stroke-width="2" opacity="0.7"/>
  
  <!-- Borde de taza -->
  <ellipse cx="40" cy="40" rx="32" ry="30" fill="none" stroke="#3E2723" stroke-width="2" opacity="0.4"/>
</svg>
