<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5161D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B1114;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo de fondo con gradiente -->
  <circle cx="40" cy="40" r="36" fill="url(#brandGradient)" filter="url(#glow)"/>
  
  <!-- Taza de café estilizada -->
  <path d="M 25 35 Q 25 28 32 28 L 48 28 Q 55 28 55 35 L 55 48 Q 55 55 48 55 L 32 55 Q 25 55 25 48 Z" 
        fill="white" opacity="0.95"/>
  
  <!-- Asa de la taza -->
  <path d="M 55 35 Q 62 35 62 42 Q 62 49 55 49" 
        fill="none" stroke="white" stroke-width="2.5" opacity="0.95"/>
  
  <!-- Vapor en forma de U y C -->
  <path d="M 32 22 Q 32 18 35 18 Q 38 18 38 22" 
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 40 20 Q 43 17 46 20" 
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 48 22 Q 48 18 51 18 Q 54 18 54 22" 
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Letras UC dentro de la taza -->
  <text x="40" y="47" text-anchor="middle" font-size="16" font-weight="bold" fill="#C5161D" font-family="Inter, sans-serif">UC</text>
  
  <!-- Borde decorativo -->
  <circle cx="40" cy="40" r="37" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
</svg>
