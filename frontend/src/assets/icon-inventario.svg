<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="invGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Caja/frasco -->
  <rect x="12" y="16" width="24" height="24" rx="2" fill="url(#invGradient)" opacity="0.9"/>
  <rect x="14" y="18" width="20" height="20" rx="1" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Etiqueta -->
  <rect x="16" y="22" width="16" height="8" rx="1" fill="white" opacity="0.85"/>
  <rect x="18" y="25" width="12" height="1.5" rx="0.5" fill="#3b82f6" opacity="0.6"/>
  <rect x="18" y="28" width="8" height="1.5" rx="0.5" fill="#3b82f6" opacity="0.4"/>
  
  <!-- Indicador de nivel -->
  <rect x="32" y="32" width="4" height="8" rx="1" fill="#10b981" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
