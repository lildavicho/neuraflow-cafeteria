<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="repGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gráfico de barras -->
  <rect x="10" y="28" width="6" height="12" rx="1" fill="url(#repGradient)" opacity="0.8">
    <animate attributeName="height" values="0;12;12" dur="1.5s" begin="0s" fill="freeze"/>
    <animate attributeName="y" values="40;28;28" dur="1.5s" begin="0s" fill="freeze"/>
  </rect>
  <rect x="18" y="20" width="6" height="20" rx="1" fill="url(#repGradient)" opacity="0.85">
    <animate attributeName="height" values="0;20;20" dur="1.5s" begin="0.2s" fill="freeze"/>
    <animate attributeName="y" values="40;20;20" dur="1.5s" begin="0.2s" fill="freeze"/>
  </rect>
  <rect x="26" y="24" width="6" height="16" rx="1" fill="url(#repGradient)" opacity="0.9">
    <animate attributeName="height" values="0;16;16" dur="1.5s" begin="0.4s" fill="freeze"/>
    <animate attributeName="y" values="40;24;24" dur="1.5s" begin="0.4s" fill="freeze"/>
  </rect>
  <rect x="34" y="16" width="6" height="24" rx="1" fill="url(#repGradient)" opacity="0.95">
    <animate attributeName="height" values="0;24;24" dur="1.5s" begin="0.6s" fill="freeze"/>
    <animate attributeName="y" values="40;16;16" dur="1.5s" begin="0.6s" fill="freeze"/>
  </rect>
  
  <!-- Línea base -->
  <line x1="8" y1="41" x2="42" y2="41" stroke="#D1D5DB" stroke-width="2" opacity="0.5"/>
</svg>
