<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="forgotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Candado abierto -->
  <rect x="22" y="30" width="20" height="24" rx="3" fill="url(#forgotGradient)" opacity="0.9"/>
  <circle cx="32" cy="42" r="3" fill="white" opacity="0.9"/>
  <rect x="31" y="42" width="2" height="6" fill="white" opacity="0.9"/>
  
  <!-- Arco del candado (abierto) -->
  <path d="M 26 30 L 26 22 Q 26 16 32 16 Q 38 16 38 22 L 38 26" 
        fill="none" stroke="url(#forgotGradient)" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 32 30; -5 32 30; 0 32 30" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Llave -->
  <circle cx="48" cy="20" r="4" fill="#10b981" opacity="0.9"/>
  <rect x="44" y="20" width="8" height="2" fill="#10b981" opacity="0.9"/>
  <rect x="50" y="18" width="2" height="2" fill="#10b981" opacity="0.9"/>
  <rect x="50" y="22" width="2" height="2" fill="#10b981" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Interrogante -->
  <text x="32" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#C5161D" font-family="Inter, sans-serif">?</text>
</svg>
