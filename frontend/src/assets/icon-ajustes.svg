<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ajustesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Engranaje -->
  <circle cx="24" cy="24" r="8" fill="url(#ajustesGradient)" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 24 24; 360 24 24" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="24" r="4" fill="white" opacity="0.9"/>
  
  <!-- Dientes del engranaje -->
  <g opacity="0.9">
    <rect x="22" y="10" width="4" height="6" rx="1" fill="url(#ajustesGradient)"/>
    <rect x="22" y="32" width="4" height="6" rx="1" fill="url(#ajustesGradient)"/>
    <rect x="10" y="22" width="6" height="4" rx="1" fill="url(#ajustesGradient)"/>
    <rect x="32" y="22" width="6" height="4" rx="1" fill="url(#ajustesGradient)"/>
    <rect x="14" y="14" width="4" height="4" rx="1" fill="url(#ajustesGradient)" transform="rotate(45 16 16)"/>
    <rect x="30" y="14" width="4" height="4" rx="1" fill="url(#ajustesGradient)" transform="rotate(-45 32 16)"/>
    <rect x="14" y="30" width="4" height="4" rx="1" fill="url(#ajustesGradient)" transform="rotate(-45 16 32)"/>
    <rect x="30" y="30" width="4" height="4" rx="1" fill="url(#ajustesGradient)" transform="rotate(45 32 32)"/>
    <animateTransform attributeName="transform" type="rotate" values="0 24 24; 360 24 24" dur="8s" repeatCount="indefinite"/>
  </g>
</svg>
