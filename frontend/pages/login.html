<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - UCACUE Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="/css/app.css" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    body.loaded { opacity: 1; }
    .login-card { backdrop-filter: blur(10px); }
    .btn-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .btn-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(163, 6, 6, 0.3); }
    
    /* Fix input text visibility */
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      color: #1f2937 !important;
    }
    
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: #a30606;
      outline: none;
      box-shadow: 0 0 0 3px rgba(163, 6, 6, 0.1);
    }
    
    /* Dark mode support */
    .dark input[type="email"],
    .dark input[type="password"],
    .dark input[type="text"] {
      background-color: #374151;
      border-color: #4b5563;
      color: #f9fafb !important;
    }
    
    .dark input::placeholder {
      color: #9ca3af;
    }
    
    .dark .login-card {
      background-color: rgba(31, 41, 55, 0.9);
      border-color: #374151;
    }
    
    .dark body {
      background: linear-gradient(to bottom right, #111827, #1f2937, #111827);
    }
  </style>
</head>
<body class="h-full flex items-center justify-center bg-gradient-to-br from-gray-50 via-white to-gray-100">
  
  <div id="loginContainer" class="w-full max-w-md px-6">
    <!-- Logo y título -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-red-600 to-red-800 mb-4 shadow-lg">
        <i data-lucide="coffee" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">UCACUE Bar</h1>
      <p class="text-gray-600">Sistema de Gestión Cafetería</p>
    </div>

    <!-- Card principal -->
    <div class="login-card bg-white/90 rounded-2xl shadow-2xl p-8 border border-gray-100">
      
      <!-- Tabs -->
      <div class="flex border-b border-gray-200 mb-6">
        <button id="tabLogin" class="flex-1 py-3 text-center font-semibold transition-all border-b-2 border-red-600 text-red-600">
          Iniciar Sesión
        </button>
        <button id="tabRegister" class="flex-1 py-3 text-center font-semibold transition-all border-b-2 border-transparent text-gray-500 hover:text-gray-700">
          Crear Cuenta
        </button>
      </div>

      <!-- Formulario Login -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i data-lucide="mail" class="w-4 h-4 inline mr-1"></i>
            Correo Electrónico
          </label>
          <input 
            type="email" 
            id="loginEmail" 
            required
            placeholder="usuario@ucacue.edu.ec"
            class="input-focus w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-600/20 transition-all"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i data-lucide="lock" class="w-4 h-4 inline mr-1"></i>
            Contraseña
          </label>
          <input 
            type="password" 
            id="loginPassword" 
            required
            placeholder="••••••••"
            class="input-focus w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-600/20 transition-all"
          >
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" id="rememberMe" class="w-4 h-4 text-red-600 border-gray-300 rounded focus:ring-red-600">
            <span class="ml-2 text-gray-600">Recordarme</span>
          </label>
          <a href="/pages/forgot.html" class="text-red-600 hover:text-red-700 font-medium">¿Olvidaste tu contraseña?</a>
        </div>

        <button 
          type="submit" 
          id="loginBtn"
          class="btn-hover w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-xl flex items-center justify-center gap-2"
        >
          <span id="loginBtnText">Iniciar Sesión</span>
          <i data-lucide="log-in" class="w-5 h-5"></i>
          <div id="loginSpinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
        </button>
      </form>

      <!-- Formulario Registro -->
      <form id="registerForm" class="space-y-5 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i data-lucide="user" class="w-4 h-4 inline mr-1"></i>
            Nombre Completo
          </label>
          <input 
            type="text" 
            id="regFullName" 
            required
            placeholder="Juan Pérez"
            class="input-focus w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-600/20 transition-all"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i data-lucide="mail" class="w-4 h-4 inline mr-1"></i>
            Correo Electrónico
          </label>
          <input 
            type="email" 
            id="regEmail" 
            required
            placeholder="usuario@ucacue.edu.ec"
            class="input-focus w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-600/20 transition-all"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i data-lucide="lock" class="w-4 h-4 inline mr-1"></i>
            Contraseña
          </label>
          <input 
            type="password" 
            id="regPassword" 
            required
            minlength="8"
            placeholder="Mínimo 8 caracteres"
            class="input-focus w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-600/20 transition-all"
          >
          <p class="text-xs text-gray-500 mt-1">Mínimo 8 caracteres</p>
        </div>

        <button 
          type="submit" 
          id="registerBtn"
          class="btn-hover w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-xl flex items-center justify-center gap-2"
        >
          <span id="registerBtnText">Crear Cuenta</span>
          <i data-lucide="user-plus" class="w-5 h-5"></i>
          <div id="registerSpinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-4 bg-white text-gray-500">O continuar con</span>
        </div>
      </div>

      <!-- Google Login -->
      <button 
        id="googleLoginBtn"
        class="btn-hover w-full bg-white border-2 border-gray-200 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-50 flex items-center justify-center gap-3"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Google</span>
      </button>

    </div>

    <!-- Footer -->
    <p class="text-center text-sm text-gray-500 mt-6">
      © 2025 UCACUE. Todos los derechos reservados.
    </p>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  
  <script type="module">
    import { ensureUnauth } from '/js/guard.js';
    import { auth } from '/js/api.js';
    
    // Make auth available globally for debugging
    window.authModule = auth;

    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', () => {
      // Guard: redirect if already logged in
      const canStay = ensureUnauth();
      
      // Only show page if user can stay
      if (canStay) {
        document.body.classList.add('loaded');
        
        // Initialize theme and icons
        if (window.ui) {
          ui.initTheme();
          ui.animateBackground();
        }
        if (window.lucide) lucide.createIcons();
        
        // GSAP: Animate container on load
        if (window.gsap) {
          gsap.from('#loginContainer', {
            opacity: 0,
            y: 30,
            duration: 0.8,
            ease: 'power3.out'
          });
        }

        // Initialize all event handlers
        initializePage();
      }
    });

    function initializePage() {
      // Tab switching
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

    function switchTab(tab) {
      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLogin.classList.add('border-red-600', 'text-red-600');
        tabLogin.classList.remove('border-transparent', 'text-gray-500');
        tabRegister.classList.add('border-transparent', 'text-gray-500');
        tabRegister.classList.remove('border-red-600', 'text-red-600');
        gsap.from(loginForm, { opacity: 0, x: -20, duration: 0.4, ease: 'power2.out' });
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabRegister.classList.add('border-red-600', 'text-red-600');
        tabRegister.classList.remove('border-transparent', 'text-gray-500');
        tabLogin.classList.add('border-transparent', 'text-gray-500');
        tabLogin.classList.remove('border-red-600', 'text-red-600');
        gsap.from(registerForm, { opacity: 0, x: 20, duration: 0.4, ease: 'power2.out' });
      }
    }

    tabLogin.addEventListener('click', () => {
      switchTab('login');
      gsap.to(tabLogin, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1 });
    });

    tabRegister.addEventListener('click', () => {
      switchTab('register');
      gsap.to(tabRegister, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1 });
    });

    // Check URL param for initial tab
    const params = new URLSearchParams(location.search);
    if (params.get('tab') === 'register') switchTab('register');

    // Login form handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');

      // Disable button and show loading
      btn.disabled = true;
      btnText.textContent = 'Iniciando...';
      spinner.classList.remove('hidden');
      gsap.to(btn, { scale: 0.98, duration: 0.1 });

      try {
        console.log('Attempting login with:', email);
        const data = await auth.login(email, password, false);
        console.log('Login response:', data);
        
        // Success animation
        gsap.to(btn, { 
          backgroundColor: '#10b981', 
          duration: 0.3,
          onComplete: () => {
            const role = (JSON.parse(localStorage.getItem('user') || '{}').role) || data.role;
            if (role === 'ADMIN') {
              window.location.href = '/pages/dashboard.html';
            } else {
              window.location.href = '/pages/pos.html';
            }
          }
        });

      } catch (error) {
        // Error animation
        gsap.to(btn, { 
          x: [0, -10, 10, -10, 10, 0],
          duration: 0.5,
          ease: 'power2.inOut'
        });
        
        const msg = error?.response?.data?.message || 'Credenciales incorrectas';
        if (window.ui) ui.toast(msg, 'error');
        else alert(msg);

        btn.disabled = false;
        btnText.textContent = 'Iniciar Sesión';
        spinner.classList.add('hidden');
        gsap.to(btn, { scale: 1, duration: 0.2 });
      }
    });

    // Register form handler
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('registerBtn');
      const btnText = document.getElementById('registerBtnText');
      const spinner = document.getElementById('registerSpinner');

      // Validations
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        if (window.ui) ui.toast('Email inválido', 'error');
        else alert('Email inválido');
        return;
      }

      if (password.length < 8) {
        if (window.ui) ui.toast('La contraseña debe tener al menos 8 caracteres', 'error');
        else alert('La contraseña debe tener al menos 8 caracteres');
        return;
      }

      // Disable button and show loading
      btn.disabled = true;
      btnText.textContent = 'Creando...';
      spinner.classList.remove('hidden');
      gsap.to(btn, { scale: 0.98, duration: 0.1 });

      try {
        console.log('Attempting register with:', { fullName, email });
        await auth.register({ fullName, email, password });
        console.log('Register successful');
        
        // Success animation
        gsap.to(btn, { 
          backgroundColor: '#10b981', 
          duration: 0.3,
          onComplete: () => {
            if (window.ui) ui.toast('Cuenta creada exitosamente. Ahora puedes iniciar sesión.', 'success');
            setTimeout(() => switchTab('login'), 1500);
          }
        });

      } catch (error) {
        // Error animation
        gsap.to(btn, { 
          x: [0, -10, 10, -10, 10, 0],
          duration: 0.5,
          ease: 'power2.inOut'
        });
        
        const msg = error?.response?.data?.message || 'No se pudo crear la cuenta';
        if (window.ui) ui.toast(msg, 'error');
        else alert(msg);

        btn.disabled = false;
        btnText.textContent = 'Crear Cuenta';
        spinner.classList.add('hidden');
        gsap.to(btn, { scale: 1, duration: 0.2 });
      }
    });

    // Google login (placeholder)
    document.getElementById('googleLoginBtn').addEventListener('click', () => {
      gsap.to('#googleLoginBtn', { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
      if (window.ui) ui.toast('Autenticación con Google no configurada', 'warning');
      else alert('Autenticación con Google no configurada');
    });

      // Animate all buttons on hover
      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          if (!btn.disabled) gsap.to(btn, { scale: 1.02, duration: 0.2 });
        });
        btn.addEventListener('mouseleave', () => {
          gsap.to(btn, { scale: 1, duration: 0.2 });
        });
      });
    } // End initializePage

  </script>
</body>
</html>
