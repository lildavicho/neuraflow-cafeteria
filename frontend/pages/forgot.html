<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - UCACUE Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="/css/app.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .btn-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .btn-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(163, 6, 6, 0.3); }
    
    /* Dark mode */
    .dark body {
      background: linear-gradient(to bottom right, #111827, #1f2937, #111827);
    }
    
    .dark input {
      background-color: #374151;
      border-color: #4b5563;
      color: #f9fafb;
    }
    
    .dark input::placeholder {
      color: #9ca3af;
    }
    
    .dark .bg-white\/90 {
      background-color: rgba(31, 41, 55, 0.9);
      border-color: #374151;
    }
    
    .dark h1 {
      color: #f9fafb;
    }
    
    .dark p {
      color: #d1d5db;
    }
    
    .dark .bg-blue-50 {
      background-color: #1e3a5f;
      border-color: #2563eb;
    }
    
    .dark .text-blue-800 {
      color: #93c5fd;
    }
  </style>
</head>
<body class="h-full flex items-center justify-center bg-gradient-to-br from-gray-50 via-white to-gray-100 dark:bg-gray-900">
  
  <div id="forgotContainer" class="w-full max-w-md px-6">
    <!-- Back button -->
    <a href="/pages/login.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-red-600 mb-6 transition-colors">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
      <span>Volver al inicio de sesión</span>
    </a>

    <!-- Card -->
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl p-8 border border-gray-100">
      <div class="text-center mb-6">
        <img src="/assets/logo.svg" alt="UCACUE Bar Logo" class="w-20 h-20 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Recuperar Contraseña</h1>
        <p class="text-sm text-gray-600">Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu contraseña.</p>
      </div>

      <form id="forgotForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i data-lucide="mail" class="w-4 h-4 inline mr-1"></i>
            Correo Electrónico
          </label>
          <input 
            id="email" 
            type="email" 
            required 
            placeholder="usuario@ucacue.edu.ec" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-600/20 focus:border-red-600 transition-all"
          >
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="btn-hover w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-xl flex items-center justify-center gap-2"
        >
          <span id="submitBtnText">Enviar Instrucciones</span>
          <i data-lucide="send" class="w-5 h-5"></i>
          <div id="submitSpinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
        </button>
      </form>

      <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
        <p class="text-xs text-blue-800">
          <i data-lucide="info" class="w-4 h-4 inline mr-1"></i>
          Si el correo existe en nuestro sistema, recibirás un enlace para restablecer tu contraseña.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-sm text-gray-500 mt-6">
      © 2025 UCACUE. Todos los derechos reservados.
    </p>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module">
    import * as authIntegration from '/js/authIntegration.js';

    // Initialize
    if (window.ui) {
      ui.initTheme();
      ui.animateBackground();
    }
    if (window.lucide) lucide.createIcons();

    // GSAP: Animate container
    gsap.from('#forgotContainer', {
      opacity: 0,
      y: 30,
      duration: 0.8,
      ease: 'power3.out'
    });

    // Form handler
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('submitBtnText');
      const spinner = document.getElementById('submitSpinner');

      // Disable button
      btn.disabled = true;
      btnText.textContent = 'Enviando...';
      spinner.classList.remove('hidden');
      gsap.to(btn, { scale: 0.98, duration: 0.1 });

      try {
        console.log('[ForgotPassword] Sending reset email to:', email);
        const result = await authIntegration.resetPassword(email);
        console.log('[ForgotPassword] Reset email sent:', result);
        
        // Success animation
        gsap.to(btn, { 
          backgroundColor: '#10b981', 
          duration: 0.3,
          onComplete: () => {
            const message = result.message || 'Se ha enviado un correo para restablecer tu contraseña';
            if (window.ui && window.ui.toast) {
              window.ui.toast(message, 'success');
            } else {
              alert('✅ ' + message);
            }
            setTimeout(() => {
              window.location.href = '/pages/login.html';
            }, 2000);
          }
        });

      } catch (err) {
        console.error('[ForgotPassword] Error:', err);
        
        // Error animation
        gsap.to(btn, { 
          x: [0, -10, 10, -10, 10, 0],
          duration: 0.5,
          ease: 'power2.inOut'
        });
        
        const msg = err.message || 'No se pudo procesar la solicitud';
        if (window.ui && window.ui.toast) {
          window.ui.toast(msg, 'error');
        } else {
          alert('❌ ' + msg);
        }

        btn.disabled = false;
        btnText.textContent = 'Enviar Instrucciones';
        spinner.classList.add('hidden');
        gsap.to(btn, { scale: 1, duration: 0.2 });
      }
    });

    // Button hover animation
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        if (!btn.disabled) gsap.to(btn, { scale: 1.02, duration: 0.2 });
      });
      btn.addEventListener('mouseleave', () => {
        gsap.to(btn, { scale: 1, duration: 0.2 });
      });
    });
  </script>
</body>
</html>
