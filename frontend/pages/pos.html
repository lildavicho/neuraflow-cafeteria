<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - UCACUE Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tabler@1.0.0-beta17/dist/css/tabler.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tabler-icons@latest/iconfont/tabler-icons.min.css" rel="stylesheet">
    <link href="../css/app.css" rel="stylesheet">
    <style>
        .pos-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 1rem;
            height: calc(100vh - 80px);
        }
        .products-section {
            display: flex;
            flex-direction: column;
        }
        .category-tabs {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            background: white;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            overflow-x: auto;
        }
        .category-tab {
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            background: var(--ucacue-light);
            border: 1px solid #dee2e6;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .category-tab.active {
            background: var(--brand);
            color: white;
            border-color: var(--brand);
        }
        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 0.5rem;
            overflow-y: auto;
        }
        .product-card {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            height: fit-content;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(179, 0, 0, 0.2);
            border-color: var(--brand);
        }
        .product-card img, .product-placeholder {
            width: 80px;
            height: 80px;
            margin: 0 auto 0.5rem;
            border-radius: 0.25rem;
            object-fit: cover;
        }
        .product-placeholder {
            background: var(--ucacue-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #6c757d;
        }
        .cart-section {
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .cart-header {
            padding: 1rem;
            background: var(--brand);
            color: white;
            border-radius: 0.5rem 0.5rem 0 0;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid #dee2e6;
            gap: 0.5rem;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .cart-summary {
            background: var(--ucacue-light);
            padding: 1rem;
            border-top: 2px solid var(--brand);
        }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.5rem;
            padding: 1rem;
        }
        .payment-method-btn {
            padding: 0.75rem;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .payment-method-btn:hover {
            border-color: var(--brand);
            background: var(--ucacue-light);
        }
        .payment-method-btn.selected {
            border-color: var(--brand);
            background: var(--brand);
            color: white;
        }
        @media (max-width: 768px) {
            .pos-container {
                grid-template-columns: 1fr;
            }
            .cart-section {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                max-height: 50vh;
                z-index: 1000;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand text-brand fw-bold" href="#">
                <i class="ti ti-shopping-cart"></i> UCACUE POS
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="input-group" style="width: 300px;">
                    <span class="input-group-text"><i class="ti ti-search"></i></span>
                    <input type="text" class="form-control" id="productSearch" placeholder="Buscar producto...">
                </div>
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="ti ti-user"></i> <span class="user-name">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="profile.html"><i class="ti ti-user"></i> Mi Perfil</a></li>
                        <li><a class="dropdown-item" href="my-orders.html"><i class="ti ti-receipt"></i> Mis Compras</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item logout-btn" href="#"><i class="ti ti-logout"></i> Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-3">
        <div class="pos-container">
            <!-- Products Section -->
            <div class="products-section">
                <!-- Category Tabs -->
                <div class="category-tabs">
                    <button class="category-tab active" data-category-id="all">
                        <i class="ti ti-apps"></i> Todos
                    </button>
                    <button class="category-tab category-filter" data-category-id="1">
                        <i class="ti ti-coffee"></i> Bebidas Calientes
                    </button>
                    <button class="category-tab category-filter" data-category-id="2">
                        <i class="ti ti-bottle"></i> Bebidas Frías
                    </button>
                    <button class="category-tab category-filter" data-category-id="3">
                        <i class="ti ti-cookie"></i> Snacks
                    </button>
                    <button class="category-tab category-filter" data-category-id="4">
                        <i class="ti ti-meat"></i> Comida Rápida
                    </button>
                    <button class="category-tab category-filter" data-category-id="5">
                        <i class="ti ti-cake"></i> Postres
                    </button>
                    <button class="category-tab category-filter" data-category-id="6">
                        <i class="ti ti-egg"></i> Desayunos
                    </button>
                </div>

                <!-- Products Grid -->
                <div class="products-grid" id="productsContainer">
                    <!-- Products will be loaded here dynamically -->
                    <div class="text-center text-muted p-4">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Cargando productos...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cart Section -->
            <div class="cart-section">
                <div class="cart-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="ti ti-shopping-cart"></i> Carrito
                            <span class="badge bg-white text-brand" id="cartCount">0</span>
                        </h5>
                        <button class="btn btn-sm btn-outline-light" id="clearCartBtn">
                            <i class="ti ti-trash"></i> Limpiar
                        </button>
                    </div>
                </div>

                <div class="cart-items" id="cartItems">
                    <div class="text-center text-muted p-4">
                        <i class="ti ti-shopping-cart-off" style="font-size: 3rem;"></i>
                        <p>Carrito vacío</p>
                    </div>
                </div>

                <div class="cart-summary">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="cartSubtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>IVA (15%):</span>
                        <span id="cartIva">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total:</span>
                        <span class="text-brand" id="cartTotal">$0.00</span>
                    </div>
                </div>

                <div class="payment-methods">
                    <button class="payment-method-btn" data-method="CASH">
                        <i class="ti ti-cash"></i>
                        <div>Efectivo</div>
                    </button>
                    <button class="payment-method-btn" data-method="TRANSFER">
                        <i class="ti ti-building-bank"></i>
                        <div>Transfer</div>
                    </button>
                    <button class="payment-method-btn" data-method="PAYPHONE">
                        <i class="ti ti-device-mobile"></i>
                        <div>PayPhone</div>
                    </button>
                    <button class="payment-method-btn" data-method="DATAFAST">
                        <i class="ti ti-credit-card"></i>
                        <div>Datafast</div>
                    </button>
                    <button class="payment-method-btn" data-method="QR">
                        <i class="ti ti-qrcode"></i>
                        <div>QR</div>
                    </button>
                </div>

                <div class="p-3 d-flex gap-2">
                    <button class="btn btn-outline-secondary flex-fill" id="holdOrderBtn">
                        <i class="ti ti-device-floppy"></i> Retener
                    </button>
                    <button class="btn btn-outline-secondary flex-fill" id="retrieveOrderBtn">
                        <i class="ti ti-download"></i> Recuperar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.0/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4/dist/algoliasearch-lite.umd.js"></script>
    
    <script type="module">
        import guard from '/js/guard.js';
        import pos from '/js/pos.js';
        import { showToast, formatCurrency, generateReceiptHTML } from '/js/ui.js';
        
        // Initialize guard
        guard.init();
        
        // GSAP animations for page load
        gsap.from(".category-tabs", {
            y: -20,
            opacity: 0,
            duration: 0.5,
            ease: "power2.out"
        });
        
        gsap.from(".cart-section", {
            x: 100,
            opacity: 0,
            duration: 0.5,
            delay: 0.2,
            ease: "power2.out"
        });
        
        // Payment method selection
        document.querySelectorAll('.payment-method-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove selected from all
                document.querySelectorAll('.payment-method-btn').forEach(b => {
                    b.classList.remove('selected');
                });
                // Add selected to clicked
                this.classList.add('selected');
                
                // Process payment
                const method = this.dataset.method;
                pos.processPayment(method);
            });
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // F1 - Cash
            if (e.key === 'F1') {
                e.preventDefault();
                pos.processPayment('CASH');
            }
            // F2 - Card
            else if (e.key === 'F2') {
                e.preventDefault();
                pos.processPayment('DATAFAST');
            }
            // F3 - Hold order
            else if (e.key === 'F3') {
                e.preventDefault();
                pos.holdOrder();
            }
            // F4 - Retrieve order
            else if (e.key === 'F4') {
                e.preventDefault();
                pos.showHeldOrders();
            }
            // ESC - Clear cart
            else if (e.key === 'Escape') {
                if (confirm('¿Limpiar el carrito?')) {
                    pos.clearCart();
                }
            }
        });
        
        // Export UI utilities for POS module
        window.showToast = showToast;
        window.formatCurrency = formatCurrency;
        window.generateReceiptHTML = generateReceiptHTML;
    </script>
</body>
</html>
