spring:
  datasource:
    url: jdbc:mysql://mysql:3306/bar_escolar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil
    username: ${DB_USER:ucacue_user}
    password: ${DB_PASS:ucacue_pass}
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      maximum-pool-size: 15
      minimum-idle: 5
  mvc:
    servlet:
      path: /api
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000
      lettuce:
        shutdown-timeout: 100
      repositories:
        enabled: false
  jpa:
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:/app/serviceAccount.json}

app:
  allowed-origins:
    - http://localhost
    - http://localhost:4200
    - http://127.0.0.1:4200
    - http://frontend

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
