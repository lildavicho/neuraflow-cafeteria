spring:
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:insightvision}?sslmode=${DB_SSL_MODE:disable}&currentSchema=${DB_SCHEMA:bar_app},public}}
    username: ${DATABASE_USERNAME:${DB_USER:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASS:postgres}}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      connection-init-sql: SET search_path TO ${DB_SCHEMA:bar_app}, public
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      maximum-pool-size: 15
      minimum-idle: 5
  mvc:
    servlet:
      path: /api
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000
      lettuce:
        shutdown-timeout: 100
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/postgresql}
    default-schema: ${DB_SCHEMA:bar_app}
    schemas: ${DB_SCHEMA:bar_app}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  auth-enabled: ${FIREBASE_AUTH_ENABLED:false}
  push-enabled: ${FIREBASE_PUSH_ENABLED:false}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

app:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:4200,http://127.0.0.1:4200,http://frontend}}
  public-tenant-registration-enabled: ${PUBLIC_TENANT_REGISTRATION_ENABLED:false}
  public-leads:
    notify-to: ${PUBLIC_LEADS_NOTIFY_TO:soporte@insightvisionia.cloud}
  sri:
    ride:
      resend:
        enabled: ${RESEND_ENABLED:false}
        api-key: ${RESEND_API_KEY:}
        base-url: ${RESEND_BASE_URL:https://api.resend.com}
        from-email: ${RESEND_FROM_EMAIL:soporte@insightvisionia.cloud}
        from-name: ${RESEND_FROM_NAME:Insight Vision IA}
        reply-to: ${RESEND_REPLY_TO:soporte@insightvisionia.cloud}
        webhook-secret: ${RESEND_WEBHOOK_SECRET:}

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
